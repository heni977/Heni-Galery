<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heni Gallery Official</title>
  <style>
    body { margin:0; font-family: Arial, sans-serif; background:#f9f9f9; color:#333; }
    header { background:#ff7f50; color:#fff; text-align:center; padding:20px; }
    header h1 { margin-bottom:5px; }
    header p { font-size:1rem; }

    /* Galeri Grid */
    .gallery { display:grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap:10px; padding:20px; max-width:1000px; margin:auto; }
    .gallery img { width:100%; height:200px; object-fit:cover; border-radius:10px; cursor:pointer; transition: transform 0.3s; }
    .gallery img:hover { transform: scale(1.05); }

    /* Modal */
    .modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); justify-content:center; align-items:center; z-index:1000; }
    .modal img { max-width:90%; max-height:90%; border-radius:10px; }
    .modal span { position:absolute; top:20px; right:30px; font-size:2rem; color:#fff; cursor:pointer; }

    /* Tombol WhatsApp */
    .order { display:block; width:max-content; margin:20px auto; background:#25D366; color:#fff; padding:15px 25px; border-radius:50px; font-size:1.1rem; text-align:center; }
    .order:hover { background:#1ebe5d; }

    footer { background:#333; color:#fff; text-align:center; padding:20px; margin-top:40px; }
    footer a { margin:0 10px; color:#fff; font-weight:bold; }
  </style>
</head>
<body>

  <header>
    <h1>Heni Gallery Official</h1>
    <p>Jual Foto & Video Premium</p>
  </header>

  <section class="gallery">
    <img src="https://images.pexels.com/photos/415829/pexels-photo-415829.jpeg" alt="Foto 1">
    <img src="https://images.pexels.com/photos/774909/pexels-photo-774909.jpeg" alt="Foto 2">
    <img src="https://images.pexels.com/photos/91227/pexels-photo-91227.jpeg" alt="Foto 3">
    <img src="https://images.pexels.com/photos/1181686/pexels-photo-1181686.jpeg" alt="Foto 4">
    <img src="https://images.pexels.com/photos/2379005/pexels-photo-2379005.jpeg" alt="Foto 5">
    <img src="https://images.pexels.com/photos/1858175/pexels-photo-1858175.jpeg" alt="Foto 6">
  </section>

  <a href="https://wa.me/6282160836944" class="order" target="_blank">Order via WhatsApp</a>

  <!-- Modal -->
  <div class="modal" id="modal">
    <span id="close">&times;</span>
    <img id="modal-img" src="">
  </div>

  <footer>
    <p>Kontak & Sosial Media</p>
    <a href="https://instagram.com/dinda99" target="_blank">Instagram</a>
    <a href="mailto:heni@example.com">Email</a>
  </footer>

  <script>
    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modal-img");
    const close = document.getElementById("close");
    const imgs = document.querySelectorAll(".gallery img");

    imgs.forEach(img => {
      img.addEventListener("click", () => {
        modal.style.display = "flex";
        modalImg.src = img.src;
      });
    });

    close.addEventListener("click", () => { modal.style.display = "none"; });
    modal.addEventListener("click", (e) => { if(e.target === modal) modal.style.display = "none"; });
  </script>

</body>
</html>
